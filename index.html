<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DŨNG-IOS CHỨNG CHỈ ESIGN</title>
    <style>
        /* CSS Cơ bản */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
        
        body {
            /* Hình nền gốc - Bạn có thể thay link ảnh khác vào đây */
            background: url('https://images.unsplash.com/photo-1611162617474-5b21e879e113?q=80&w=1000&auto=format&fit=crop') center/cover no-repeat;
            background-color: #0f0f13; /* Màu nền dự phòng */
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        /* Lớp phủ mờ màu đen để làm nổi bật chữ */
        .overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.65);
            z-index: 1;
        }

        /* Nội dung chính */
        .content {
            z-index: 2;
            padding: 20px;
            width: 100%;
            max-width: 450px;
            margin-top: -50px;
        }

        .content h1 { font-size: 38px; font-weight: 800; margin-bottom: 15px; line-height: 1.2; letter-spacing: -0.5px; }
        .content p { font-size: 16px; color: #d1d1d6; margin-bottom: 35px; line-height: 1.5; }

        /* Nút bấm kính mờ (Glassmorphism) */
        .glass-btn {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 16px 30px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            transition: all 0.3s ease;
            text-decoration: none;
        }
        .glass-btn:hover { background: rgba(255, 255, 255, 0.25); transform: translateY(-2px); }
        .glass-btn:active { transform: scale(0.97); }

        /* Thanh Menu dưới đáy */
        .bottom-nav {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            max-width: 450px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 25px;
            display: flex;
            justify-content: space-between;
            padding: 12px 20px;
            z-index: 3;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 11px;
            color: #666;
            text-decoration: none;
            font-weight: 700;
            transition: 0.2s;
            width: 20%;
        }
        .nav-item:hover, .nav-item:active { color: #007aff; }
        .nav-item svg { width: 24px; height: 24px; margin-bottom: 4px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    </style>
</head>
<body>

    <div class="overlay"></div>

    <div class="content">
        <h1>DŨNG-IOS<br>CHỨNG CHỈ ESIGN</h1>
        <p>Hệ thống website bán chứng chỉ iPhone, iPad tự động. Lấy ngay, bảo hành 30 ngày.</p>
        
        <!-- NÚT MUA HÀNG (Thay link hệ thống cũ của bạn vào href) -->
        <a href="https://dungios.io.vn/" class="glass-btn">
            Xem Bảng Giá & Mua Ngay 
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        </a>
    </div>

    <!-- THANH MENU DƯỚI ĐÁY -->
    <div class="bottom-nav">
        <!-- Nút Trang Chủ -->
        <a href="#" class="nav-item" style="color: #007aff;">
            <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            <span>TRANG CHỦ</span>
        </a>
        <!-- Nút Tra Cứu (Gắn link hệ thống check UDID cũ) -->
        <a href="https://dungios.io.vn/" class="nav-item">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <span>TRA CỨU</span>
        </a>
        <!-- Nút ESign -->
        <a href="https://esignapp.site" target="_blank" class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
            <span>CÀI ESIGN</span>
        </a>
        <!-- Nút Zalo -->
        <a href="https://zalo.me/0963095545" target="_blank" class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
            <span>ZALO</span>
        </a>
        <!-- Nút Đăng nhập -->
        <a href="https://dungios.io.vn/" class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><polyline points="10 17 15 12 10 7"></polyline><line x1="15" y1="12" x2="3" y2="12"></line></svg>
            <span>ĐĂNG NHẬP</span>
        </a>
    </div>

</body>
</html>
